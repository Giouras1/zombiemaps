<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Map Zombie Defense</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: Arial, sans-serif;
        color: #fff;
      }
      #debugUi {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        min-width: 150px;
        padding: 9px 11px;
        border-left: 3px solid #e74c3c;
        background: rgba(5, 8, 10, 0.78);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        font: 700 14px/1.55 "Courier New", monospace;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
      .debugLabel {
        color: #9aa5ad;
      }
      #ui {
        position: absolute;
        top: 94px;
        left: 12px;
        z-index: 10;
        background: rgba(5, 8, 10, 0.78);
        padding: 12px;
        border-radius: 6px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      }
      #ui h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      #ui p {
        margin: 8px 0 0;
      }
      #roundUi {
        position: absolute;
        top: 12px;
        right: 20px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 0.8;
        pointer-events: none;
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.75));
      }
      #roundLabel {
        margin-right: 5px;
        color: #f3f3f3;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.3em;
      }
      #round {
        color: #ed1c24;
        font-size: clamp(64px, 9vw, 112px);
        font-weight: 900;
        letter-spacing: -0.08em;
        -webkit-text-stroke: 2px rgba(84, 0, 0, 0.7);
        text-shadow:
          0 2px 0 #710006,
          0 0 24px rgba(237, 28, 36, 0.4);
      }
      #round.roundPop {
        animation: roundPop 450ms ease-out;
      }
      @keyframes roundPop {
        0% {
          opacity: 0;
          transform: scale(1.45);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      canvas {
        display: block;
      }
      button {
        background: #444;
        color: white;
        border: 1px solid #777;
        padding: 6px 12px;
        cursor: pointer;
        margin-top: 5px;
      }
      button:hover {
        background: #666;
      }
    </style>
  </head>
  <body>
    <div id="debugUi" aria-label="Game debug information">
      <div><span class="debugLabel">FPS</span> <span id="fps">0</span></div>
      <div>
        <span class="debugLabel">ZOMBIES LEFT</span>
        <span id="zombiesLeft">6</span>
      </div>
    </div>

    <div id="ui">
      <h2>Top-Down Zombie Defense</h2>
      <div>
        Health: <span id="hp">100</span> | Kills: <span id="score">0</span>
      </div>
      <div>Mode: <span id="mode">Shoot</span></div>
      <button id="toggleBuild">Switch to Build Mode (Wall)</button>
      <p>
        <small
          >WASD / Arrows = Move | Left Click = Shoot / Place Wall | Space =
          Toggle Mode</small
        >
      </p>
    </div>

    <div id="roundUi" aria-label="Current round">
      <span id="roundLabel">ROUND</span>
      <span id="round">1</span>
    </div>

    <canvas id="gameCanvas" aria-label="Zombie defense game"></canvas>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const fpsElement = document.getElementById("fps");
      const zombiesLeftElement = document.getElementById("zombiesLeft");
      const roundElement = document.getElementById("round");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const CAMERA_ZOOM = 1.18;
      const FIRST_ROUND_ZOMBIES = 6;
      const ZOMBIES_ADDED_PER_ROUND = 3;
      const ZOMBIE_SPAWN_DELAY = 650;
      const ROUND_BREAK = 1800;

      let score = 0;
      let isBuildMode = false;
      let round = 1;
      let zombiesToSpawn = 0;
      let zombiesLeftInRound = 0;
      let nextZombieSpawnAt = 0;
      let nextRoundAt = null;

      let lastFrameAt = performance.now();
      let fpsSampleStartedAt = lastFrameAt;
      let fpsFrames = 0;

      // Input handling
      const keys = {};
      const mouse = { x: 0, y: 0 };

      window.addEventListener("keydown", (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.code === "Space") {
          toggleMode();
        }
      });
      window.addEventListener(
        "keyup",
        (e) => (keys[e.key.toLowerCase()] = false),
      );
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      // Player setup
      const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 12,
        speed: 190,
        hp: 100,
        angle: 0,
      };

      // Game entities
      const bullets = [];
      const zombies = [];
      const walls = [];

      // Controls & Mode Toggle
      document
        .getElementById("toggleBuild")
        .addEventListener("click", toggleMode);

      function toggleMode() {
        isBuildMode = !isBuildMode;
        document.getElementById("mode").textContent = isBuildMode
          ? "Build (Walls Can Clip)"
          : "Shoot";
        document.getElementById("toggleBuild").textContent = isBuildMode
          ? "Switch to Shoot Mode"
          : "Switch to Build Mode (Wall)";
      }

      function screenToWorld(screenX, screenY) {
        return {
          x: player.x + (screenX - canvas.width / 2) / CAMERA_ZOOM,
          y: player.y + (screenY - canvas.height / 2) / CAMERA_ZOOM,
        };
      }

      // Shooting / Building interaction
      window.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return; // Left click only

        const target = screenToWorld(mouse.x, mouse.y);

        if (isBuildMode) {
          // Place wall centered on mouse with intentional clipping allowed
          walls.push({
            x: target.x - 20,
            y: target.y - 20,
            width: 40,
            height: 40,
            hp: 100,
          });
        } else {
          // Shoot bullet from player center towards mouse position
          const angle = Math.atan2(target.y - player.y, target.x - player.x);
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 520,
            vy: Math.sin(angle) * 520,
          });
        }
      });

      // Spawn zombies (Red dots)
      function spawnZombie() {
        const halfViewWidth = canvas.width / (2 * CAMERA_ZOOM);
        const halfViewHeight = canvas.height / (2 * CAMERA_ZOOM);
        const spawnMargin = 24;
        let x, y;

        if (Math.random() < 0.5) {
          x =
            player.x +
            (Math.random() < 0.5 ? -1 : 1) *
              (halfViewWidth + spawnMargin);
          y = player.y + (Math.random() * 2 - 1) * halfViewHeight;
        } else {
          x = player.x + (Math.random() * 2 - 1) * halfViewWidth;
          y =
            player.y +
            (Math.random() < 0.5 ? -1 : 1) *
              (halfViewHeight + spawnMargin);
        }

        zombies.push({
          x,
          y,
          radius: 6,
          speed: 42 + Math.random() * 18,
        });
      }

      function startRound(startedAt) {
        const roundSize =
          FIRST_ROUND_ZOMBIES + (round - 1) * ZOMBIES_ADDED_PER_ROUND;

        zombiesToSpawn = roundSize;
        zombiesLeftInRound = roundSize;
        nextZombieSpawnAt = startedAt + 350;
        nextRoundAt = null;

        roundElement.textContent = round;
        zombiesLeftElement.textContent = zombiesLeftInRound;
        roundElement.classList.remove("roundPop");
        void roundElement.offsetWidth;
        roundElement.classList.add("roundPop");
      }

      function updateRound(now) {
        if (zombiesToSpawn > 0 && now >= nextZombieSpawnAt) {
          spawnZombie();
          zombiesToSpawn -= 1;
          nextZombieSpawnAt = now + ZOMBIE_SPAWN_DELAY;
        }

        if (nextRoundAt !== null && now >= nextRoundAt) {
          round += 1;
          startRound(now);
        }
      }

      // Game Loop
      function update(now, deltaTime) {
        if (player.hp <= 0) return;

        updateRound(now);

        // Movement
        let moveX = 0;
        let moveY = 0;
        if (keys["w"] || keys["arrowup"]) moveY -= 1;
        if (keys["s"] || keys["arrowdown"]) moveY += 1;
        if (keys["a"] || keys["arrowleft"]) moveX -= 1;
        if (keys["d"] || keys["arrowright"]) moveX += 1;

        const moveLength = Math.hypot(moveX, moveY) || 1;
        player.x += (moveX / moveLength) * player.speed * deltaTime;
        player.y += (moveY / moveLength) * player.speed * deltaTime;

        const aimTarget = screenToWorld(mouse.x, mouse.y);
        player.angle = Math.atan2(
          aimTarget.y - player.y,
          aimTarget.x - player.x,
        );

        // Update Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx * deltaTime;
          b.y += b.vy * deltaTime;

          // Remove offscreen bullets
          const halfViewWidth = canvas.width / (2 * CAMERA_ZOOM) + 40;
          const halfViewHeight = canvas.height / (2 * CAMERA_ZOOM) + 40;
          if (
            Math.abs(b.x - player.x) > halfViewWidth ||
            Math.abs(b.y - player.y) > halfViewHeight
          ) {
            bullets.splice(i, 1);
            continue;
          }

          // Bullet-Zombie collisions
          for (let j = zombies.length - 1; j >= 0; j--) {
            const z = zombies[j];
            const dist = Math.hypot(b.x - z.x, b.y - z.y);
            if (dist < z.radius + 3) {
              zombies.splice(j, 1);
              bullets.splice(i, 1);
              score += 10;
              zombiesLeftInRound = Math.max(0, zombiesLeftInRound - 1);
              document.getElementById("score").textContent = score;
              zombiesLeftElement.textContent = zombiesLeftInRound;

              if (zombiesLeftInRound === 0) {
                nextRoundAt = now + ROUND_BREAK;
              }
              break;
            }
          }
        }

        // Update Zombies
        for (let i = zombies.length - 1; i >= 0; i--) {
          const z = zombies[i];

          // Chase player
          const angle = Math.atan2(player.y - z.y, player.x - z.x);
          z.x += Math.cos(angle) * z.speed * deltaTime;
          z.y += Math.sin(angle) * z.speed * deltaTime;

          // Zombie damage to player
          const distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
          if (distToPlayer < player.radius + z.radius) {
            player.hp -= 24 * deltaTime;
            document.getElementById("hp").textContent = Math.max(
              0,
              Math.floor(player.hp),
            );
          }
        }
      }

      function drawMapBackground() {
        // Map simulation background grid / road aesthetic
        ctx.fillStyle = "#2c3e50";
        const halfViewWidth = canvas.width / (2 * CAMERA_ZOOM);
        const halfViewHeight = canvas.height / (2 * CAMERA_ZOOM);
        const left = player.x - halfViewWidth;
        const right = player.x + halfViewWidth;
        const top = player.y - halfViewHeight;
        const bottom = player.y + halfViewHeight;
        ctx.fillRect(left, top, right - left, bottom - top);

        ctx.strokeStyle = "#34495e";
        ctx.lineWidth = 2;
        const gridSize = 80;
        const firstGridX = Math.floor(left / gridSize) * gridSize;
        const firstGridY = Math.floor(top / gridSize) * gridSize;
        for (let x = firstGridX; x <= right; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
          ctx.stroke();
        }
        for (let y = firstGridY; y <= bottom; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.stroke();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Keep the player centered and slightly zoom the game world.
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
        ctx.translate(-player.x, -player.y);

        drawMapBackground();

        // Draw Walls (allows overlapping placement / clipping)
        ctx.fillStyle = "#7f8c8d";
        ctx.strokeStyle = "#95a5a6";
        ctx.lineWidth = 2;
        walls.forEach((w) => {
          ctx.fillRect(w.x, w.y, w.width, w.height);
          ctx.strokeRect(w.x, w.y, w.width, w.height);
        });

        // Draw Bullets
        ctx.fillStyle = "#f1c40f";
        bullets.forEach((b) => {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw Zombies (Red Dots)
        ctx.fillStyle = "#e74c3c";
        zombies.forEach((z) => {
          ctx.beginPath();
          ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw Player
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);

        // Gun
        ctx.fillStyle = "#111";
        ctx.fillRect(0, -3, player.radius + 8, 6);

        // Body
        ctx.fillStyle = "#3498db";
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        ctx.restore();

        if (player.hp <= 0) {
          ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#e74c3c";
          ctx.font = "48px Arial";
          ctx.textAlign = "center";
          ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
        }
      }

      function updateFps(now) {
        fpsFrames += 1;
        const sampleDuration = now - fpsSampleStartedAt;

        if (sampleDuration >= 500) {
          fpsElement.textContent = Math.round((fpsFrames * 1000) / sampleDuration);
          fpsFrames = 0;
          fpsSampleStartedAt = now;
        }
      }

      function loop(now) {
        const deltaTime = Math.min((now - lastFrameAt) / 1000, 0.033);
        lastFrameAt = now;

        updateFps(now);
        update(now, deltaTime);
        draw();
        requestAnimationFrame(loop);
      }

      startRound(performance.now());
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
